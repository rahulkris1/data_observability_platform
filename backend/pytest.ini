[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests
    slow: Tests that take a long time to run
    requires_spark: Tests that require PySpark
    requires_db: Tests that require database connection
    requires_airflow: Tests that require Apache Airflow

# Logging
log_cli = false
log_cli_level = INFO

# Coverage options (if pytest-cov is installed)
# Uncomment these lines to enable coverage reporting
# [coverage:run]
# source = app
# omit = 
#     */tests/*
#     */migrations/*
#     */__pycache__/*

# Timeout for tests (if pytest-timeout is installed)
# timeout = 300

# PySpark specific settings
# filterwarnings =
#     ignore::DeprecationWarning
#     ignore::PendingDeprecationWarning
