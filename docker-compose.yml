version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dop-postgres
    environment:
      POSTGRES_USER: dop_user
      POSTGRES_PASSWORD: dop_password
      POSTGRES_DB: data_observability
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dop_user -d data_observability"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dop-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: dop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - dop-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: dop-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - dop-network

  # MinIO Client for bucket creation
  minio-setup:
    image: minio/mc:latest
    container_name: dop-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/raw-data --ignore-existing;
      /usr/bin/mc mb myminio/processed-data --ignore-existing;
      /usr/bin/mc mb myminio/audit-data --ignore-existing;
      /usr/bin/mc anonymous set download myminio/raw-data;
      /usr/bin/mc anonymous set download myminio/processed-data;
      /usr/bin/mc anonymous set download myminio/audit-data;
      echo 'MinIO buckets created successfully';
      exit 0;
      "
    networks:
      - dop-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  dop-network:
    driver: bridge
